const DATA = [{"id": "attention-is-all-you-need-4-3", "paper": "attention-is-all-you-need", "page": 4, "block": 3, "src": "We call our particular attention \"Scaled Dot-Product Attention\" (Figure 2). The input consists of queries and keys of dimension {v1}, and values of dimension {v2}. We compute the dot products of the query with all keys, divide each by {v3}, and apply a softmax function to obtain the weights on the values.", "labels": [["A", "google", "Chúng tôi gọi sự chú ý đặc biệt của mình là \"Sự chú ý đến sản phẩm chấm theo tỷ lệ\" (Hình 2). Đầu vào bao gồm các truy vấn và khóa có thứ nguyên {v1} và các giá trị của thứ nguyên {v2}. Chúng tôi tính toán tích số chấm của truy vấn bằng tất cả các khóa, chia từng khóa cho {v3} và áp dụng hàm softmax để thu được trọng số trên các giá trị."], ["B", "2b", "Chúng tôi gọi chú ý đặc biệt của mình là \"Scaled Dot-Product Attention\" (Hình 2). Đầu vào bao gồm các query và keys có chiều {v1}, và values có chiều {v2}. Chúng tôi tính tích vô hướng của query với tất cả keys, chia mỗi tích cho {v3}, và áp dụng hàm softmax để thu được trọng số trên các values."], ["C", "4b", "Chúng tôi gọi attention đặc biệt của chúng tôi là \"Scaled Dot-Product Attention\" (Hình 2). Đầu vào bao gồm queries và keys có chiều {v1}, và values có chiều {v2}. Chúng tôi tính tích vô hướng của query với tất cả keys, chia mỗi kết quả cho {v3}, và áp dụng hàm softmax để lấy trọng số trên các values."], ["D", "9b", "Chúng tôi gọi attention đặc biệt của chúng tôi là \"Scaled Dot-Product Attention\" (Hình 2). Đầu vào gồm queries và keys có chiều {v1}, và values có chiều {v2}. Chúng tôi tính tích vô hướng của query với tất cả keys, chia mỗi cái cho {v3}, rồi áp dụng hàm softmax để có trọng số trên values."]]}, {"id": "attention-is-all-you-need-4-4", "paper": "attention-is-all-you-need", "page": 4, "block": 4, "src": "In practice, we compute the attention function on a set of queries simultaneously, packed together into a matrix {v1}. The keys and values are also packed together into matrices {v2} and {v3} . We compute the matrix of outputs as:", "labels": [["A", "2b", "Trong thực tế, chúng tôi tính hàm attention trên một tập hợp các queries đồng thời, gói gọn vào một ma trận {v1}. Các keys và values cũng được gói gọn vào các ma trận {v2} và {v3}. Chúng tôi tính ma trận đầu ra như:"], ["B", "google", "Trong thực tế, chúng tôi tính toán đồng thời hàm chú ý trên một tập hợp truy vấn, được đóng gói cùng nhau thành ma trận {v1}. Các khóa và giá trị cũng được đóng gói cùng nhau thành ma trận {v2} và {v3} . Chúng tôi tính toán ma trận đầu ra như sau:"], ["C", "4b", "Trong thực tế, chúng tôi tính attention function trên một tập queries đồng thời, đóng gói vào ma trận {v1}. Keys và values cũng được đóng gói vào ma trận {v2} và {v3}. Chúng tôi tính ma trận đầu ra như:"], ["D", "9b", "Trong thực tế, chúng tôi tính hàm attention trên tập queries đồng thời, đóng gói vào ma trận {v1}. Keys và values cũng đóng gói vào ma trận {v2} và {v3}. Chúng tôi tính ma trận đầu ra như:"]]}, {"id": "attention-is-all-you-need-4-5", "paper": "attention-is-all-you-need", "page": 4, "block": 5, "src": "The two most commonly used attention functions are additive attention [2], and dot-product (multiplicative) attention. Dot-product attention is identical to our algorithm, except for the scaling factor of {v1} . Additive attention computes the compatibility function using a feed-forward network with a single hidden layer. While the two are similar in theoretical complexity, dot-product attention is much faster and more space-efficient in practice, since it can be implemented using highly optimized matrix multiplication code.", "labels": [["A", "google", "Hai hàm chú ý được sử dụng phổ biến nhất là chú ý cộng [2] và chú ý tích số chấm (nhân). Sự chú ý của sản phẩm chấm giống hệt với thuật toán của chúng tôi, ngoại trừ hệ số tỷ lệ là {v1} . Sự chú ý bổ sung tính toán chức năng tương thích bằng cách sử dụng mạng chuyển tiếp nguồn cấp dữ liệu với một lớp ẩn duy nhất. Mặc dù cả hai đều giống nhau về độ phức tạp về mặt lý thuyết, nhưng sự chú ý của tích số chấm nhanh hơn và tiết kiệm không gian hơn trong thực tế vì nó có thể được thực hiện bằng cách sử dụng mã nhân ma trận được tối ưu hóa cao."], ["B", "9b", "Hai hàm attention phổ biến nhất là additive attention [2], và dot-product (nhân) attention. Dot-product attention giống thuật toán của chúng tôi, trừ hệ số tỷ lệ {v1}. Additive attention tính hàm tương thích dùng mạng tiến với một lớp ẩn. Dù hai cái có độ phức tạp lý thuyết tương tự, dot-product attention nhanh hơn và tiết kiệm bộ nhớ hơn trong thực tế, vì có thể dùng mã nhân ma trận tối ưu."], ["C", "4b", "Hai attention function phổ biến nhất là additive attention [2] và dot-product (multiplicative) attention. Dot-product attention giống với thuật toán của chúng tôi, ngoại trừ hệ số tỷ lệ {v1}. Additive attention tính hàm tương thích bằng mạng feed-forward với một lớp ẩn. Mặc dù hai phương pháp có độ phức tạp lý thuyết tương tự, dot-product attention nhanh hơn và tiết kiệm không gian hơn trong thực tế, vì nó có thể được thực hiện bằng mã nhân ma trận tối ưu hóa cao."], ["D", "2b", "Hai hàm attention phổ biến nhất là additive attention [2], và dot-product (tích vô hướng) attention. Dot-product attention giống với thuật toán của chúng tôi, trừ khi có hệ số điều chỉnh {v1}. Additive attention tính hàm tương thích bằng mạng feed-forward với một lớp ẩn. Mặc dù hai hàm này có độ phức tạp lý thuyết tương tự, dot-product attention nhanh hơn và hiệu quả hơn về bộ nhớ trong thực tế, vì có thể triển khai bằng mã tích vô hướng tối ưu hóa cao."]]}, {"id": "attention-is-all-you-need-4-6", "paper": "attention-is-all-you-need", "page": 4, "block": 6, "src": "While for small values of {v1} the two mechanisms perform similarly, additive attention outperforms dot product attention without scaling for larger values of {v2} [3]. We suspect that for large values of {v3}, the dot products grow large in magnitude, pushing the softmax function into regions where it has extremely small gradients {v4}. To counteract this effect, we scale the dot products by {v5} .", "labels": [["A", "4b", "Mặc dù với các giá trị nhỏ của {v1} hai cơ chế hoạt động tương tự, additive attention vượt trội hơn dot product attention không có tỷ lệ khi {v2} lớn [3]. Chúng tôi nghi ngờ rằng với các giá trị lớn của {v3}, các tích vô hướng tăng lớn về độ lớn, đẩy hàm softmax vào vùng có gradient cực nhỏ {v4}. Để chống lại hiệu ứng này, chúng tôi tỷ lệ các tích vô hướng bằng {v5}."], ["B", "9b", "Mà với giá trị nhỏ của {v1} hai cơ chế hoạt động tương tự, additive attention vượt trội dot product attention không tỷ lệ với giá trị lớn của {v2} [3]. Chúng tôi nghi ngờ rằng với giá trị lớn của {v3}, tích vô hướng tăng lớn về độ lớn, đẩy hàm softmax vào vùng có gradient cực nhỏ {v4}. Để chống lại hiệu ứng này, chúng tôi tỷ lệ tích vô hướng bằng {v5}."], ["C", "google", "Trong khi đối với các giá trị nhỏ của {v1}, hai cơ chế hoạt động tương tự nhau, thì sự chú ý bổ sung hoạt động tốt hơn sự chú ý của sản phẩm chấm mà không cần điều chỉnh tỷ lệ đối với các giá trị lớn hơn của {v2} [3]. Chúng tôi nghi ngờ rằng đối với các giá trị lớn của {v3}, tích số chấm tăng theo độ lớn, đẩy hàm softmax vào các vùng có độ dốc cực kỳ nhỏ {v4}. Để chống lại hiệu ứng này, chúng tôi chia tỷ lệ tích số chấm theo {v5} ."], ["D", "2b", "Mặc dù với các giá trị nhỏ của {v1}, hai cơ chế hoạt động tương tự, additive attention vượt trội hơn dot product attention không có scaling cho các giá trị lớn của {v2} [3]. Chúng tôi nghi ngờ rằng với các giá trị lớn của {v3}, tích vô hướng tăng lên đáng kể, đẩy hàm softmax vào các vùng có gradient cực kỳ nhỏ {v4}. Để đối phó với hiệu ứng này, chúng tôi nhân các tích vô hướng với {v5}."]]}, {"id": "attention-is-all-you-need-4-8", "paper": "attention-is-all-you-need", "page": 4, "block": 8, "src": "Instead of performing a single attention function with {v1}-dimensional keys, values and queries, we found it beneficial to linearly project the queries, keys and values {v2} times with different, learned linear projections to {v3} and {v4} dimensions, respectively. On each of these projected versions of queries, keys and values we then perform the attention function in parallel, yielding {v5}-dimensional", "labels": [["A", "2b", "Thay vì thực hiện một hàm attention với {v1}-dimensional keys, values và queries, chúng tôi tìm thấy việc tuyến tính hóa queries, keys và values {v2} lần với các phép chiếu tuyến tính khác nhau, học được đến {v3} và {v4} chiều, tương ứng. Trên mỗi phiên bản projections của queries, keys và values, chúng tôi thực hiện hàm attention song song, cho ra {v5}-dimensional output values."], ["B", "9b", "Thay vì thực hiện một hàm attention với keys, values và queries có chiều {v1}, chúng tôi thấy có lợi khi chiếu tuyến tính queries, keys và values {v2} lần với các chiếu tuyến tính khác nhau, học được, đến {v3} và {v4} chiều, tương ứng. Trên mỗi phiên bản chiếu của queries, keys và values này, chúng tôi thực hiện hàm attention song song, tạo ra {v5}-chiều,"], ["C", "google", "Thay vì thực hiện một chức năng chú ý duy nhất với các khóa, giá trị và truy vấn có chiều {v1}, chúng tôi nhận thấy việc chiếu tuyến tính các truy vấn, khóa và giá trị {v2} lần với các phép chiếu tuyến tính đã học khác nhau tới các chiều {v3} và {v4} tương ứng. Sau đó, trên mỗi phiên bản truy vấn, khóa và giá trị dự kiến ​​này, chúng tôi thực hiện song song chức năng chú ý, mang lại {v5} chiều"], ["D", "4b", "Thay vì thực hiện một attention function duy nhất với keys, values và queries có chiều {v1}, chúng tôi phát hiện có lợi để chiếu tuyến tính queries, keys và values {v2} lần với các chiếu tuyến tính học được khác nhau vào chiều {v3} và {v4} tương ứng. Trên mỗi phiên bản chiếu của queries, keys và values này, chúng tôi thực hiện attention function song song, tạo ra {v5}-dimensional"]]}, {"id": "attention-is-all-you-need-4-9", "paper": "attention-is-all-you-need", "page": 4, "block": 9, "src": "{v1}To illustrate why the dot products get large, assume that the components of {v2} and {v3} are independent random variables with mean 0 and variance 1. Then their dot product, {v4}, has mean 0 and variance {v5}.", "labels": [["A", "9b", "{v1}Để minh họa tại sao tích vô hướng tăng lớn, giả sử các thành phần của {v2} và {v3} là biến ngẫu nhiên độc lập với trung bình 0 và phương sai 1. Khi đó tích vô hướng của chúng, {v4}, có trung bình 0 và phương sai {v5}."], ["B", "2b", "{v1}Để minh họa tại sao tích vô hướng tăng lên, giả sử các thành phần của {v2} và {v3} là các biến ngẫu nhiên độc lập có trung bình 0 và phương sai 1. Sau đó tích vô hướng của chúng, {v4}, có trung bình 0 và phương sai {v5}."], ["C", "4b", "{v1}Để minh họa tại sao các tích vô hướng tăng lớn, giả sử các thành phần của {v2} và {v3} là các biến ngẫu nhiên độc lập có trung bình 0 và phương sai 1. Khi đó tích vô hướng của chúng, {v4}, có trung bình 0 và phương sai {v5}."], ["D", "google", "{v1}Để minh họa lý do tại sao tích vô hướng lớn, giả sử rằng các thành phần của {v2} và {v3} là các biến ngẫu nhiên độc lập có trung bình 0 và phương sai 1. Khi đó tích vô hướng của chúng, {v4}, có trung bình 0 và phương sai {v5}."]]}, {"id": "bert-3-0", "paper": "bert", "page": 3, "block": 0, "src": "Figure 1: Overall pre-training and fine-tuning procedures for BERT. Apart from output layers, the same architectures are used in both pre-training and fine-tuning. The same pre-trained model parameters are used to initialize models for different down-stream tasks. During fine-tuning, all parameters are fine-tuned. [CLS] is a special symbol added in front of every input example, and [SEP] is a special separator token (e.g. separating questions/answers).", "labels": [["A", "2b", "Hình 1: Quy trình huấn luyện trước và tinh chỉnh cho BERT. Ngoài các lớp đầu ra, các cấu trúc giống nhau được sử dụng trong cả hai giai đoạn huấn luyện trước và tinh chỉnh. Các tham số mô hình đã được huấn luyện trước được sử dụng để khởi tạo các mô hình cho các nhiệm vụ tiếp theo khác nhau. Trong giai đoạn tinh chỉnh, tất cả các tham số đều được tinh chỉnh. [CLS] là một ký hiệu đặc biệt được thêm trước mỗi ví dụ đầu vào, và [SEP] là một token phân cách đặc biệt (ví dụ: phân cách câu hỏi/câu trả lời)."], ["B", "google", "Hình 1: Quy trình đào tạo trước và tinh chỉnh tổng thể cho BERT. Ngoài các lớp đầu ra, các kiến ​​trúc tương tự được sử dụng trong cả quá trình huấn luyện trước và tinh chỉnh. Các tham số mô hình được huấn luyện trước tương tự được sử dụng để khởi tạo mô hình cho các tác vụ tiếp theo khác nhau. Trong quá trình tinh chỉnh, tất cả các tham số đều được tinh chỉnh. [CLS] là ký hiệu đặc biệt được thêm vào trước mỗi ví dụ đầu vào và [SEP] là mã thông báo phân tách đặc biệt (ví dụ: phân tách câu hỏi/câu trả lời)."], ["C", "4b", "Hình 1: Quy trình huấn luyện trước và tinh chỉnh tổng quát cho BERT. Ngoài các lớp đầu ra, cùng kiến trúc được sử dụng cho cả hai quy trình. Các tham số mô hình đã được huấn luyện trước được dùng để khởi tạo cho các mô hình phục vụ các nhiệm vụ hạ lưu khác nhau. Trong quá trình tinh chỉnh, tất cả các tham số đều được tinh chỉnh. [CLS] là ký hiệu đặc biệt được thêm vào trước mỗi ví dụ đầu vào, và [SEP] là token tách biệt đặc biệt (ví dụ: tách câu hỏi/trả lời)."], ["D", "9b", "Hình 1: Tổng quan các quy trình huấn luyện trước và tinh chỉnh cho BERT. Ngoài các lớp đầu ra, các kiến trúc giống nhau được sử dụng trong cả hai giai đoạn. Các tham số mô hình đã được huấn luyện trước được dùng để khởi tạo các mô hình cho các nhiệm vụ hạ nguồn khác nhau. Trong quá trình tinh chỉnh, tất cả các tham số đều được tinh chỉnh. [CLS] là ký hiệu đặc biệt được thêm vào trước mỗi ví dụ đầu vào, và [SEP] là token phân cách đặc biệt (ví dụ: tách câu hỏi/câu trả lời)."]]}, {"id": "bert-3-1", "paper": "bert", "page": 3, "block": 1, "src": "ing and auto-encoder objectives have been used for pre-training such models (Howard and Ruder, 2018; Radford et al., 2018; Dai and Le, 2015).", "labels": [["A", "2b", "Mục tiêu tự mã hóa và các mục tiêu khác đã được sử dụng cho việc huấn luyện các mô hình này (Howard và Ruder, 2018; Radford et al., 2018; Dai và Le, 2015)."], ["B", "9b", "ngôn ngữ và mục tiêu mã hóa tự động đã được sử dụng để huấn luyện trước các mô hình này (Howard và Ruder, 2018; Radford et al., 2018; Dai và Le, 2015)."], ["C", "4b", "huấn luyện và mục tiêu auto-encoder đã được sử dụng để huấn luyện các mô hình như vậy (Howard và Ruder, 2018; Radford et al., 2018; Dai và Le, 2015)."], ["D", "google", "Mục tiêu mã hóa và tự động mã hóa đã được sử dụng để đào tạo trước các mô hình như vậy (Howard và Ruder, 2018; Radford và cộng sự, 2018; Dai và Le, 2015)."]]}, {"id": "bert-3-5", "paper": "bert", "page": 3, "block": 5, "src": "We introduce BERT and its detailed implementation in this section. There are two steps in our framework: <i>pre-training</i> and <i>fine-tuning</i>. During pre-training, the model is trained on unlabeled data over different pre-training tasks. For fine-tuning, the BERT model is first initialized with the pre-trained parameters, and all of the parameters are fine-tuned using labeled data from the downstream tasks. Each downstream task has separate fine-tuned models, even though they are initialized with the same pre-trained parameters. The question-answering example in Figure 1 will serve as a running example for this section.", "labels": [["A", "2b", "Chúng tôi giới thiệu BERT và hiệu năng chi tiết của nó trong phần này. Có hai bước trong khung làm việc của chúng tôi: <i>huấn luyện trước</i> và <i>tinh chỉnh</i>. Trong quá trình huấn luyện trước, mô hình được huấn luyện trên dữ liệu không có nhãn qua các nhiệm vụ huấn luyện trước khác nhau. Đối với tinh chỉnh, mô hình BERT được khởi tạo lần đầu tiên với các tham số đã được huấn luyện trước, và tất cả các tham số đều được tinh chỉnh sử dụng dữ liệu có nhãn từ các nhiệm vụ sau. Mỗi nhiệm vụ sau có các mô hình tinh chỉnh riêng biệt, dù chúng được khởi tạo với các tham số đã được huấn luyện trước giống nhau. Mẫu câu hỏi trả lời trong Hình 1 sẽ đóng vai trò là mẫu chạy cho phần này."], ["B", "4b", "Chúng tôi giới thiệu BERT và thực hiện chi tiết trong phần này. Có hai bước trong khung làm việc của chúng tôi: <i>huấn luyện trước</i> và <i>tinh chỉnh</i>. Trong quá trình huấn luyện trước, mô hình được huấn luyện trên dữ liệu không nhãn qua các nhiệm vụ huấn luyện trước khác nhau. Đối với tinh chỉnh, mô hình BERT được khởi tạo trước với các tham số đã huấn luyện trước, và tất cả các tham số đều được tinh chỉnh sử dụng dữ liệu có nhãn từ các nhiệm vụ hạ lưu. Mỗi nhiệm vụ hạ lưu có các mô hình tinh chỉnh riêng biệt, mặc dù chúng được khởi tạo từ cùng các tham số đã huấn luyện trước. Ví dụ về câu hỏi-trả lời trong Hình 1 sẽ phục vụ làm ví dụ chạy cho phần này."], ["C", "9b", "Chúng tôi giới thiệu BERT và triển khai chi tiết của nó trong phần này. Khung làm việc của chúng tôi bao gồm hai bước: <i>huấn luyện trước</i> và <i>tinh chỉnh</i>. Trong giai đoạn huấn luyện trước, mô hình được huấn luyện trên dữ liệu không gán nhãn qua các nhiệm vụ huấn luyện trước khác nhau. Đối với tinh chỉnh, mô hình BERT trước tiên được khởi tạo với các tham số đã được huấn luyện trước, và tất cả các tham số đều được tinh chỉnh sử dụng dữ liệu có nhãn từ các nhiệm vụ hạ nguồn. Mỗi nhiệm vụ hạ nguồn có các mô hình được tinh chỉnh riêng biệt, mặc dù chúng đều được khởi tạo với cùng các tham số đã được huấn luyện trước. Ví dụ về trả lời câu hỏi trong Hình 1 sẽ đóng vai trò là ví dụ xuyên suốt cho phần này."], ["D", "google", "Chúng tôi giới thiệu BERT và cách triển khai chi tiết của nó trong phần này. Có hai bước trong khuôn khổ của chúng tôi: <i>đào tạo trước</i> và <i>tinh chỉnh</i>. Trong quá trình đào tạo trước, mô hình được đào tạo trên dữ liệu chưa được gắn nhãn qua các nhiệm vụ đào tạo trước khác nhau. Để tinh chỉnh, mô hình BERT trước tiên được khởi tạo với các tham số được huấn luyện trước và tất cả các tham số được tinh chỉnh bằng cách sử dụng dữ liệu được gắn nhãn từ các tác vụ xuôi dòng. Mỗi tác vụ xuôi dòng có các mô hình tinh chỉnh riêng biệt, mặc dù chúng được khởi tạo với cùng các tham số được huấn luyện trước. Ví dụ trả lời câu hỏi trong Hình 1 sẽ đóng vai trò là ví dụ thực tế cho phần này."]]}, {"id": "bert-3-8", "paper": "bert", "page": 3, "block": 8, "src": "<b>Model Architecture</b> BERT’s model architecture is a multi-layer bidirectional Transformer encoder based on the original implementation described in Vaswani et al. (2017) and released in the tensor2tensor library.{v1} Because the use of Transformers has become common and our implementation is almost identical to the original, we will omit an exhaustive background description of the model architecture and refer readers to Vaswani et al. (2017) as well as excellent guides such as “The Annotated Transformer.”{v2}", "labels": [["A", "9b", "<b>Kiến trúc Mô hình</b> Kiến trúc mô hình của BERT là bộ mã hóa Transformer hai chiều nhiều lớp dựa trên triển khai gốc được mô tả trong Vaswani et al. (2017) và phát hành trong thư viện tensor2tensor.{v1} Vì việc sử dụng Transformers đã trở nên phổ biến và triển khai của chúng tôi gần như giống hệt bản gốc, chúng tôi sẽ bỏ qua mô tả nền tảng chi tiết về kiến trúc mô hình và hướng độc giả đến Vaswani et al. (2017) cũng như các hướng dẫn xuất sắc như “The Annotated Transformer.”{v2}"], ["B", "google", "<b>Kiến trúc mô hình</b> Kiến trúc mô hình của BERT là bộ mã hóa Transformer hai chiều nhiều lớp dựa trên cách triển khai ban đầu được mô tả trong Vaswani et al. (2017) và được phát hành trong thư viện tensor2tensor.{v1} Vì việc sử dụng Transformers đã trở nên phổ biến và cách triển khai của chúng tôi gần như giống với bản gốc nên chúng tôi sẽ bỏ qua phần mô tả cơ bản đầy đủ về kiến ​​trúc mô hình và giới thiệu cho độc giả tham khảo Vaswani et al. (2017) cũng như những hướng dẫn xuất sắc như “The Annotated Transformer”.{v2}"], ["C", "4b", "<b>Kiến trúc mô hình</b> Kiến trúc mô hình của BERT là một bộ mã hóa Transformer hai chiều nhiều lớp dựa trên thực hiện ban đầu được mô tả trong Vaswani et al. (2017) và được phát hành trong thư viện tensor2tensor.{v1} Vì việc sử dụng Transformer đã trở nên phổ biến và thực hiện của chúng tôi gần như giống hệt với bản gốc, chúng tôi sẽ bỏ qua mô tả chi tiết về kiến trúc mô hình và hướng dẫn độc giả đến Vaswani et al. (2017) cũng như các hướng dẫn xuất sắc như \"The Annotated Transformer.\"{v2}"], ["D", "2b", "<b>Cấu trúc mô hình</b> BERT là một encoder Transformer hai chiều nhiều lớp, được mô tả trong bản phát hành nguyên thủy của Vaswani et al. (2017) và được phát hành trong thư viện tensor2tensor. {v1} Vì việc sử dụng Transformers đã trở nên phổ biến và bản thực hiện của chúng gần như giống hệt bản gốc, chúng tôi sẽ lược bỏ mô tả nền tảng chi tiết về cấu trúc mô hình và chỉ dẫn người đọc đến Vaswani et al. (2017) cũng như các hướng dẫn tuyệt vời như \"The Annotated Transformer.\"{v2}"]]}, {"id": "bert-3-9", "paper": "bert", "page": 3, "block": 9, "src": "In this work, we denote the number of layers (i.e., Transformer blocks) as {v1}, the hidden size as {v2}, and the number of self-attention heads as {v3} We primarily report results on two model sizes: <b>BERT</b>{v4} (L=12, H=768, A=12, Total Parameters=110M) and <b>BERT</b>{v5} (L=24, H=1024, A=16, Total Parameters=340M).", "labels": [["A", "google", "Trong công việc này, chúng tôi biểu thị số lớp (tức là khối Transformer) là {v1}, kích thước ẩn là {v2} và số lượng đầu tự chú ý là {v3}. Chúng tôi chủ yếu báo cáo kết quả trên hai kích thước mô hình: <b>BERT</b>{v4} (L=12, H=768, A=12, Total Parameters=110M) và <b>BERT</b>{v5} (L=24, H=1024, A=16, Tổng thông số=340M)."], ["B", "4b", "Trong công việc này, chúng tôi ký hiệu số lượng lớp (tức là khối Transformer) là {v1}, kích thước ẩn là {v2}, và số lượng đầu tự chú ý là {v3}. Chúng tôi chủ yếu báo cáo kết quả trên hai kích thước mô hình: <b>BERT</b>{v4} (L=12, H=768, A=12, Tổng Tham Số=110M) và <b>BERT</b>{v5} (L=24, H=1024, A=16, Tổng Tham Số=340M)."], ["C", "2b", "Trong công trình này, chúng tôi ký hiệu số lớp (tức là các khối Transformer) là {v1}, thông số ẩn là {v2}, và số lượng đầu vào attention là {v3}. Chúng tôi chủ yếu báo cáo kết quả trên hai kích thước mô hình: <b>BERT</b>{v4} (L=12, H=768, A=12, Tổng tham số=110M) và <b>BERT</b>{v5} (L=24, H=1024, A=16, Tổng tham số=340M)."], ["D", "9b", "Trong công việc này, chúng tôi ký hiệu số lượng lớp (tức là khối Transformer) là {v1}, kích thước ẩn là {v2}, và số lượng đầu tự chú ý là {v3}. Chúng tôi chủ yếu báo cáo kết quả trên hai kích thước mô hình: <b>BERT</b>{v4} (L=12, H=768, A=12, Tổng Tham số=110M) và <b>BERT</b>{v5} (L=24, H=1024, A=16, Tổng Tham số=340M)."]]}, {"id": "datasentinel-9-0", "paper": "datasentinel", "page": 9, "block": 0, "src": "TABLE 1: Our DataSentinel is effective in detecting existing prompt injection attacks. The FNR for each injected task and FPR are averaged over the 7 types of target tasks. Table 10–Table 16 in Appendix show the FNR and FPR for each injected-target task combination for each attack.", "labels": [["A", "9b", "TABLE 1: datasentinel của chúng tôi hiệu quả trong việc phát hiện các tấn công tiêm prompt hiện có. FNR cho mỗi nhiệm vụ bị tiêm và FPR được trung bình trên 7 loại nhiệm vụ mục tiêu. Bảng 10–16 trong Phụ lục hiển thị FNR và FPR cho mỗi tổ hợp nhiệm vụ tiêm-mục tiêu cho mỗi tấn công."], ["B", "google", "BẢNG 1: DataSentinel của chúng tôi có hiệu quả trong việc phát hiện các cuộc tấn công tiêm nhiễm kịp thời hiện có. FNR cho mỗi nhiệm vụ được chèn và FPR được tính trung bình trên 7 loại nhiệm vụ mục tiêu. Bảng 10–Bảng 16 trong Phụ lục hiển thị FNR và FPR cho từng tổ hợp nhiệm vụ được tiêm vào mục tiêu cho mỗi cuộc tấn công."], ["C", "4b", "Bảng 1: Datasentinel của chúng tôi hiệu quả trong việc phát hiện các tấn công tiêm prompt hiện có. FNR cho từng nhiệm vụ bị tiêm và FPR được trung bình hóa trên 7 loại nhiệm vụ mục tiêu. Bảng 10–Bảng 16 trong Phụ lục hiển thị FNR và FPR cho mỗi tổ hợp nhiệm vụ mục tiêu bị tiêm và tấn công."], ["D", "2b", "TABLE 1: Datasentinel cụ thể trong việc phát hiện các tấn công tiêm sẵn có. FNR và FPR cho mỗi nhiệm vụ bị tiêm và FPR được trung bình hóa trên 7 loại nhiệm vụ mục tiêu. Bảng 10–16 trong Phụ lục cho thấy FNR và FPR cho mỗi tổ hợp nhiệm vụ bị tiêm-mục tiêu cho mỗi loại tấn công."]]}, {"id": "datasentinel-9-18", "paper": "datasentinel", "page": 9, "block": 18, "src": "TABLE 2: FNRs of DataSentinel in detecting Availability Attack (the injected task is to affect the availability of an LLM-integrated application) and PLeak (the injected task is to steal target instruction) for each target task.", "labels": [["A", "9b", "TABLE 2: FNR của datasentinel trong việc phát hiện tấn công khả dụng (nhiệm vụ bị tiêm là ảnh hưởng khả dụng của ứng dụng llm-integrated) và PLeak (nhiệm vụ bị tiêm là đánh cắp hướng dẫn mục tiêu) cho mỗi nhiệm vụ mục tiêu."], ["B", "google", "BẢNG 2: FNR của DataSentinel trong việc phát hiện Tấn công sẵn có (tác vụ được chèn nhằm ảnh hưởng đến tính khả dụng của ứng dụng tích hợp LLM) và PLeak (tác vụ được chèn là đánh cắp lệnh mục tiêu) cho từng tác vụ mục tiêu."], ["C", "2b", "Bảng 2: FNR của Datasentinel trong phát hiện tấn công khả dụng (mục đích tiêm là ảnh hưởng khả dụng của một ứng dụng LLM-integrated) và PLeak (mục đích tiêm là đánh cắp hướng dẫn mục tiêu) cho mỗi nhiệm vụ mục tiêu."], ["D", "4b", "Bảng 2: FNRs của Datasentinel trong việc phát hiện Tấn công Khả dụng (nhiệm vụ bị tiêm là ảnh hưởng khả dụng của ứng dụng tích hợp LLM) và PLeak (nhiệm vụ bị tiêm là trộm hướng dẫn mục tiêu) cho từng nhiệm vụ mục tiêu."]]}, {"id": "datasentinel-9-29", "paper": "datasentinel", "page": 9, "block": 29, "src": "{v1} <b>Embedding-vector-based detector (EVD):</b> In this baseline, we train a traditional binary classifier to detect contaminated target data. We sample 500 data points from the training set of the Gigaword dataset as clean target data samples. We further use the Combined Attack to construct 500 contaminated target data samples by sampling an injected task from the Gigaword dataset for each clean target data sample. Then, we use the CLIP text encoder (clip-vit-base-patch32 [47]) to compute a feature vector for each clean or contaminated target data sample. Given these 1,000 feature vectors and their ground-truth labels (i.e., “clean” or “contaminated”), we train a two-layer neural network classifier, which consists of a hidden layer (with dimension 128) followed by an output layer. We train the neural network for 50 epochs with a learning rate of 0.001 and a batch size of 8.", "labels": [["A", "9b", "{v1} <b>Máy phát hiện dựa trên vector embedding (EVD):</b> Trong baseline này, chúng tôi huấn luyện một bộ phân loại nhị phân truyền thống để phát hiện dữ liệu mục tiêu bị nhiễm. Chúng tôi lấy 500 điểm dữ liệu từ tập huấn luyện của tập Gigaword làm mẫu dữ liệu mục tiêu sạch. Chúng tôi tiếp tục sử dụng Combined Attack để xây dựng 500 mẫu dữ liệu mục tiêu bị nhiễm bằng cách lấy một nhiệm vụ bị tiêm từ tập Gigaword cho mỗi mẫu dữ liệu mục tiêu sạch. Sau đó, chúng tôi sử dụng bộ mã hóa văn bản CLIP (clip-vit-base-patch32 [47]) để tính toán một vector đặc trưng cho mỗi mẫu dữ liệu mục tiêu sạch hoặc bị nhiễm. Với 1.000 vector đặc trưng này và nhãn thực tế của chúng (tức là “sạch” hoặc “bị nhiễm”), chúng tôi huấn luyện một bộ phân loại mạng nơ-ron hai lớp, bao gồm một lớp ẩn (với chiều 128) tiếp theo là một lớp đầu ra. Chúng tôi huấn luyện mạng nơ-ron trong 50 epoch với tốc độ học 0.001 và kích thước batch 8."], ["B", "4b", "{v1} <b>Máy phát hiện dựa trên vector embedding (EVD):</b> Trong cơ sở này, chúng tôi huấn luyện một bộ phân loại nhị phân truyền thống để phát hiện dữ liệu mục tiêu bị nhiễm. Chúng tôi lấy 500 điểm dữ liệu từ tập huấn luyện của bộ dữ liệu Gigaword làm mẫu dữ liệu mục tiêu sạch. Chúng tôi tiếp tục sử dụng Tấn công kết hợp để xây dựng 500 mẫu dữ liệu mục tiêu bị nhiễm bằng cách lấy một nhiệm vụ bị tiêm từ bộ dữ liệu Gigaword cho mỗi mẫu dữ liệu mục tiêu sạch. Sau đó, chúng tôi sử dụng bộ mã hóa văn bản CLIP (clip-vit-base-patch32 [47]) để tính toán vector đặc trưng cho mỗi mẫu dữ liệu mục tiêu sạch hoặc bị nhiễm. Với 1.000 vector đặc trưng này và nhãn thực (tức là “sạch” hoặc “bị nhiễm”), chúng tôi huấn luyện một bộ phân loại mạng nơ-ron hai lớp, bao gồm một lớp ẩn (với chiều 128) theo sau bởi lớp đầu ra. Chúng tôi huấn luyện mạng nơ-ron trong 50 epoch với tốc độ học 0.001 và kích thước batch 8."], ["C", "2b", "{v1} <b>Detector dựa trên vector embedding (EVD):</b> Trong cơ sở này, chúng tôi huấn luyện một classifier nhị phân truyền thống để phát hiện dữ liệu mục tiêu bị nhiễm. Chúng tôi lấy 500 điểm dữ liệu từ tập huấn luyện của bộ dữ liệu Gigaword làm mẫu dữ liệu mục tiêu sạch. Chúng tôi tiếp tục sử dụng tấn công kết hợp để tạo ra 500 mẫu dữ liệu mục tiêu bị nhiễm bằng cách lấy nhiệm vụ bị tiêm từ bộ dữ liệu Gigaword cho mỗi mẫu dữ liệu mục tiêu sạch. Sau đó, chúng tôi sử dụng encoder văn bản CLIP (clip-vit-base-patch32 [47]) để tính toán vector đặc trưng cho mỗi mẫu dữ liệu mục tiêu sạch hoặc bị nhiễm. Với 1,000 vector đặc trưng và nhãn thực nghiệm (tức là \"sạch\" hoặc \"nhiễm\"), chúng tôi huấn luyện một classifier mạng nơ-ron hai lớp, bao gồm lớp ẩn (với chiều 128) tiếp theo là lớp đầu ra. Chúng tôi huấn luyện mạng nơ-ron trong 50 cuộc chạy với learning rate 0.001 và kích thước batch 8."], ["D", "google", "{v1} <b>Trình phát hiện dựa trên vectơ nhúng (EVD):</b> Trong cơ sở này, chúng tôi đào tạo trình phân loại nhị phân truyền thống để phát hiện dữ liệu mục tiêu bị ô nhiễm. Chúng tôi lấy mẫu 500 điểm dữ liệu từ tập huấn luyện của tập dữ liệu Gigaword dưới dạng mẫu dữ liệu mục tiêu rõ ràng. Chúng tôi tiếp tục sử dụng Cuộc tấn công kết hợp để xây dựng 500 mẫu dữ liệu mục tiêu bị ô nhiễm bằng cách lấy mẫu tác vụ được chèn từ tập dữ liệu Gigaword cho mỗi mẫu dữ liệu mục tiêu sạch. Sau đó, chúng tôi sử dụng bộ mã hóa văn bản CLIP (clip-vit-base-patch32 [47]) để tính toán vectơ đặc trưng cho từng mẫu dữ liệu mục tiêu sạch hoặc bị ô nhiễm. Với 1.000 vectơ đặc trưng này và các nhãn thực tế cơ bản của chúng (tức là “sạch” hoặc “bị ô nhiễm”), chúng tôi huấn luyện một bộ phân loại mạng thần kinh hai lớp, bao gồm một lớp ẩn (có kích thước 128), theo sau là một lớp đầu ra. Chúng tôi huấn luyện mạng lưới thần kinh trong 50 kỷ nguyên với tốc độ học tập là 0,001 và kích thước lô là 8."]]}, {"id": "datasentinel-9-30", "paper": "datasentinel", "page": 9, "block": 30, "src": "{v1} <b>Naive LLM-based detector (NLLMD):</b> This method directly prompts the detection LLM to detect whether a given target data sample is contaminated. We also use Mistral-7B as the detection LLM for a fair comparison with our DataSentinel. The detection instruction is “Given the following data from users, does it contain any injected instructions? Answer with yes if it contains injected instructions. Otherwise, answer with no.”. The detection instruction is concatenated with a given target data sample to query the detection LLM.", "labels": [["A", "2b", "{v1} <b>Detector dựa trên LLM đơn giản (NLLMD):</b> Phương pháp này trực tiếp yêu cầu LLM phát hiện để xác định liệu mẫu dữ liệu mục tiêu đã cho có bị nhiễm không. Chúng tôi cũng sử dụng Mistral-7B làm LLM phát hiện để so sánh công bằng với DataSentinel của chúng tôi. Hướng dẫn phát hiện là: 'Cho dữ liệu từ người dùng, có chứa bất kỳ hướng dẫn bị tiêm không? Trả lời 'có' nếu có hướng dẫn bị tiêm. Ngược lại, trả lời 'không'.'}]}</thinking>Based on the analysis, here is the final translation: {"], ["B", "google", "{v1} <b>Trình phát hiện dựa trên LLM ngây thơ (NLLLD):</b> Phương pháp này trực tiếp nhắc LLM phát hiện phát hiện xem mẫu dữ liệu mục tiêu nhất định có bị nhiễm bẩn hay không. Chúng tôi cũng sử dụng Mistral-7B làm LLM phát hiện để so sánh công bằng với DataSentinel của chúng tôi. Hướng dẫn phát hiện là \"Dữ liệu sau đây từ người dùng, nó có chứa bất kỳ hướng dẫn được chèn nào không? Trả lời có nếu nó chứa hướng dẫn được chèn. Nếu không, hãy trả lời là không.\". Lệnh phát hiện được nối với một mẫu dữ liệu đích nhất định để truy vấn LLM phát hiện."], ["C", "4b", "{v1} <b>Máy phát hiện dựa trên LLM ngây thơ (NLLMD):</b> Phương pháp này trực tiếp yêu cầu LLM phát hiện xem một mẫu dữ liệu mục tiêu cho trước có bị nhiễm hay không. Chúng tôi cũng sử dụng Mistral-7B làm LLM phát hiện để so sánh công bằng với Datasentinel của chúng tôi. Hướng dẫn phát hiện là “Cho dữ liệu sau từ người dùng, nó có chứa bất kỳ hướng dẫn bị tiêm nào không? Trả lời yes nếu nó chứa hướng dẫn bị tiêm. Ngược lại, trả lời no.”. Hướng dẫn phát hiện được nối với một mẫu dữ liệu mục tiêu cho trước để truy vấn LLM phát hiện."], ["D", "9b", "{v1} <b>Máy phát hiện LLM Naive (NLLMD):</b> Phương pháp này trực tiếp yêu cầu LLM phát hiện xem một mẫu dữ liệu mục tiêu cho trước có bị nhiễm hay không. Chúng tôi cũng sử dụng Mistral-7B làm LLM phát hiện để so sánh công bằng với datasentinel của chúng tôi. Hướng dẫn phát hiện là “Cho dữ liệu sau từ người dùng, liệu nó có chứa bất kỳ hướng dẫn bị tiêm nào? Trả lời yes nếu nó chứa hướng dẫn bị tiêm. Ngược lại, trả lời no.”. Hướng dẫn phát hiện được nối với một mẫu dữ liệu mục tiêu cho trước để truy vấn LLM phát hiện."]]}, {"id": "datasentinel-9-33", "paper": "datasentinel", "page": 9, "block": 33, "src": "{v1} <b>PromptGuard:</b> PromptGuard [49] also fine-tunes a detection LLM as a classifier to detect malicious prompts and contaminated target data. It was fine-tuned and released by Meta. Given a target data sample, it has three possible outputs: benign, injection, or jailbreak. If the output is injection or jailbreak, we consider the target data sample to be contaminated.", "labels": [["A", "9b", "{v1} <b>PromptGuard:</b> PromptGuard [49] cũng fine-tune một LLM phát hiện làm bộ phân loại để phát hiện prompt độc hại và dữ liệu mục tiêu bị nhiễm. Nó được fine-tune và phát hành bởi Meta. Với một mẫu dữ liệu mục tiêu, nó có ba kết quả có thể: benign, injection, hoặc jailbreak. Nếu kết quả là injection hoặc jailbreak, chúng tôi coi mẫu dữ liệu mục tiêu đó là bị nhiễm."], ["B", "google", "{v1} <b>PromptGuard:</b> NhắcGuard [49] cũng tinh chỉnh LLM phát hiện như một công cụ phân loại để phát hiện các lời nhắc độc hại và dữ liệu mục tiêu bị ô nhiễm. Nó đã được tinh chỉnh và phát hành bởi Meta. Với một mẫu dữ liệu mục tiêu, nó có ba kết quả đầu ra có thể xảy ra: lành tính, chèn nội dung hoặc bẻ khóa. Nếu đầu ra là tiêm nhiễm hoặc bẻ khóa, chúng tôi coi mẫu dữ liệu mục tiêu bị ô nhiễm."], ["C", "2b", "{v1} <b>PromptGuard:</b> PromptGuard [49] cũng fine-tune một LLM phát hiện làm classifier để phát hiện prompt độc hại và dữ liệu mục tiêu bị nhiễm. Nó đã được fine-tune và ra mắt bởi Meta. Với một mẫu dữ liệu mục tiêu, nó có ba đầu ra: benign, injection, hoặc jailbreak. Nếu đầu ra là injection hoặc jailbreak, chúng tôi coi mẫu dữ liệu mục tiêu là bị nhiễm."], ["D", "4b", "{v1} <b>PromptGuard:</b> PromptGuard [49] cũng hoàn chỉnh LLM phát hiện làm bộ phân loại để phát hiện prompt độc hại và dữ liệu mục tiêu bị nhiễm. Nó được hoàn chỉnh và phát hành bởi Meta. Với một mẫu dữ liệu mục tiêu, nó có ba đầu ra có thể: lành tính, tiêm, hoặc jailbreak. Nếu đầu ra là tiêm hoặc jailbreak, chúng tôi coi mẫu dữ liệu mục tiêu là bị nhiễm."]]}, {"id": "datasentinel-9-34", "paper": "datasentinel", "page": 9, "block": 34, "src": "{v1} <b>Known-answer detection (KAD):</b> As shown in a benchmark study [7], known-answer detection is the most promising among existing detectors. We use the open-source code [7] in our experiments. Our DataSentinel has two key differences with this baseline. First, our DataSentinel fine-tunes the detection LLM while KAD uses a standard LLM without fine-tuning it. Second, KAD does not take strong adaptive attacks into consideration by design. As a result, our experimental results show that KAD has limited effectiveness.", "labels": [["A", "2b", "{v1} <b>Phát hiện câu trả lời đã biết (KAD):</b> Như được minh họa trong một nghiên cứu đánh giá [7], phát hiện câu trả lời đã biết là phương pháp hứa hẹn nhất trong các máy phát hiện hiện có. Chúng tôi sử dụng mã nguồn mở [7] trong thí nghiệm của chúng tôi. DataSentinel của chúng tôi có hai điểm khác biệt quan trọng với phương pháp cơ bản này. Thứ nhất, DataSentinel của chúng tôi fine-tune LLM phát hiện trong khi KAD sử dụng LLM tiêu chuẩn mà không fine-tune nó. Thứ hai, KAD không tính đến các tấn công thích nghi mạnh mẽ theo thiết kế. Do đó, kết quả thí nghiệm của chúng tôi cho thấy KAD có hiệu quả hạn chế."], ["B", "9b", "{v1} <b>Phát hiện biết trước đáp án (KAD):</b> Như được chỉ ra trong một nghiên cứu benchmark [7], phát hiện biết trước đáp án là triển vọng nhất trong các máy phát hiện hiện có. Chúng tôi sử dụng mã nguồn mở [7] trong các thí nghiệm của chúng tôi. datasentinel của chúng tôi có hai điểm khác biệt chính với baseline này. Đầu tiên, datasentinel của chúng tôi fine-tune LLM phát hiện trong khi KAD sử dụng LLM tiêu chuẩn mà không fine-tune nó. Thứ hai, KAD không tính đến các tấn công thích nghi mạnh theo thiết kế. Kết quả là, các kết quả thí nghiệm của chúng tôi cho thấy KAD có hiệu quả hạn chế."], ["C", "google", "{v1} <b>Phát hiện câu trả lời đã biết (KAD):</b> Như được trình bày trong nghiên cứu điểm chuẩn [7], phát hiện câu trả lời đã biết là công cụ hứa hẹn nhất trong số các công cụ phát hiện hiện có. Chúng tôi sử dụng mã nguồn mở [7] trong các thử nghiệm của mình. DataSentinel của chúng tôi có hai điểm khác biệt chính với đường cơ sở này. Đầu tiên, DataSentinel của chúng tôi tinh chỉnh LLM phát hiện trong khi KAD sử dụng LLM tiêu chuẩn mà không tinh chỉnh nó. Thứ hai, KAD không xem xét các cuộc tấn công thích ứng mạnh mẽ theo thiết kế. Kết quả thực nghiệm của chúng tôi cho thấy KAD có hiệu quả hạn chế."], ["D", "4b", "{v1} <b>Phát hiện biết đáp án (KAD):</b> Như được hiển thị trong một nghiên cứu đánh giá [7], phát hiện biết đáp án là có triển vọng nhất trong số các máy phát hiện hiện có. Chúng tôi sử dụng mã nguồn mở [7] trong các thí nghiệm của chúng tôi. Datasentinel của chúng tôi có hai khác biệt chính tion (10) is the most efficient among the other three. Generally speaking, all these approaches attempt to modify Equation (6) based on the decomposition of Equation (3) under the self-attention settings in Equation (2), which was originally proposed in Vaswani et al. [2017]. They commonly introduced to directly add the position information to the context representations. Unlikely, our approach aims to derive the relative position encoding from Equation (1) under some constraints. Next, we show that the derived approach is more interpretable by incorporating relative position information with the rotation of context representations.", "labels": [["A", "9b", "Một so sánh bốn biến thể của nhúng vị trí tương đối Radford và Narasimhan [2018] cho thấy biến thể tương tự phương trình (10) là hiệu quả nhất trong ba biến thể còn lại. Nói chung, tất cả các cách tiếp cận này đều cố gắng sửa đổi phương trình (6) dựa trên sự phân tích của phương trình (3) dưới cài đặt tự chú ý trong phương trình (2), vốn được đề xuất lần đầu bởi Vaswani et al. [2017]. Họ thường giới thiệu việc thêm trực tiếp thông tin vị trí vào các biểu diễn ngữ cảnh. Không giống như vậy, cách tiếp cận của chúng tôi nhằm dẫn xuất mã hóa vị trí tương đối từ phương trình (1) dưới một số ràng buộc. Tiếp theo, chúng tôi chứng minh cách tiếp cận dẫn xuất này dễ diễn giải hơn bằng cách kết hợp thông tin vị trí tương đối với sự xoay của các biểu diễn ngữ cảnh."], ["B", "google", "So sánh bốn biến thể của phương pháp nhúng vị trí tương đối Radford và Narasimhan [2018] đã chỉ ra rằng biến thể tương tự như Phương trình (10) là hiệu quả nhất trong số ba biến thể còn lại. Nói chung, tất cả các cách tiếp cận này đều cố gắng sửa đổi Phương trình (6) dựa trên việc phân tách Phương trình (3) theo cài đặt tự chú ý trong Phương trình (2), ban đầu được đề xuất trong Vaswani et al. [2017]. Họ thường giới thiệu cách thêm trực tiếp thông tin vị trí vào biểu diễn ngữ cảnh. Không chắc, cách tiếp cận của chúng tôi nhằm mục đích lấy mã hóa vị trí tương đối từ Phương trình (1) theo một số ràng buộc. Tiếp theo, chúng tôi chứng minh rằng cách tiếp cận dẫn xuất dễ hiểu hơn bằng cách kết hợp thông tin vị trí tương đối với phép xoay các biểu diễn ngữ cảnh."], ["C", "2b", "So sánh của bốn biến thể mã hóa vị trí tương đối Radford và Narasimhan [2018] cho thấy biến thể tương tự như phương trình (10) là hiệu quả nhất trong ba biến thể khác. Nói chung, tất cả các phương pháp này đều cố gắng sửa đổi phương trình (6) dựa trên phân tích phương trình (3) dưới các cài đặt tự chú ý trong phương trình (2), vốn ban đầu được đề xuất trong Vaswani et al. [2017]. Họ thường đưa vào để trực tiếp thêm thông tin vị trí vào biểu diễn ngữ cảnh. Không may, phương pháp của chúng tôi nhằm suy ra mã hóa vị trí tương đối từ phương trình (1) dưới một số ràng buộc. Tiếp theo, chúng tôi chứng minh rằng phương pháp được suy ra này có thể giải thích rõ hơn bằng cách kết hợp thông tin vị trí tương đối với việc xoay biểu diễn ngữ cảnh."], ["D", "4b", "So sánh bốn biến thể của nhúng vị trí tương đối Radford và Narasimhan [2018] cho thấy biến thể tương tự Phương trình (10) là hiệu quả nhất trong ba biến thể còn lại. Nói chung, tất cả các phương pháp này đều cố gắng sửa đổi Phương trình (6) dựa trên phân tích của Phương trình (3) trong cài đặt tự chú ý của Phương trình (2), vốn được đề xuất ban đầu bởi Vaswani et al. [2017]. Họ thường giới thiệu việc thêm trực tiếp thông tin vị trí vào các biểu diễn ngữ cảnh. Không giống vậy, phương pháp của chúng tôi nhằm mục đích dẫn xuất mã hóa vị trí tương đối từ Phương trình (1) dưới một số ràng buộc. Tiếp theo, chúng tôi chứng minh rằng phương pháp dẫn xuất này dễ giải thích hơn bằng cách tích hợp thông tin vị trí tương đối với việc xoay các biểu diễn ngữ cảnh."]]}, {"id": "roformer-rope-4-4", "paper": "roformer-rope", "page": 4, "block": 4, "src": "In this section, we discuss the proposed rotary position embedding (RoPE). We first formulate the relative position encoding problem in Section <b>(3.1)</b>, we then derive the RoPE in Section <b>(3.2)</b> and investigate its properties in Section <b>(3.3)</b>.", "labels": [["A", "2b", "Trong phần này, chúng tôi thảo luận về nhúng vị trí xoay (RoPE). Chúng tôi lần đầu tiên hình thành vấn đề mã hóa vị trí tương đối trong Phần <b>(3.1)</b>, sau đó chúng tôi suy ra RoPE trong Phần <b>(3.2)</b> và nghiên cứu tính chất của nó trong Phần <b>(3.3)</b>."], ["B", "9b", "Trong phần này, chúng tôi thảo luận về nhúng vị trí xoay (RoPE) được đề xuất. Chúng tôi trước hết xây dựng bài toán mã hóa vị trí tương đối trong phần <b>(3.1)</b>, sau đó dẫn xuất RoPE trong phần <b>(3.2)</b> và khảo sát các tính chất của nó trong phần <b>(3.3)</b>."], ["C", "4b", "Trong phần này, chúng tôi thảo luận về nhúng vị trí xoay (RoPE). Chúng tôi trước hết xây dựng bài toán mã hóa vị trí tương đối trong phần <b>(3.1)</b>, sau đó dẫn xuất RoPE trong phần <b>(3.2)</b> và khảo sát các tính chất của nó trong phần <b>(3.3)</b>."], ["D", "google", "Trong phần này, chúng tôi thảo luận về việc nhúng vị trí quay được đề xuất (RoPE). Trước tiên, chúng tôi xây dựng bài toán mã hóa vị trí tương đối trong Phần <b>(3.1)</b>, sau đó chúng tôi rút ra RoPE trong Phần <b>(3.2)</b> và điều tra các thuộc tính của nó trong Phần <b>(3.3)</b>."]]}, {"id": "roformer-rope-4-6", "paper": "roformer-rope", "page": 4, "block": 6, "src": "Transformer-based language modeling usually leverages the position information of individual tokens through a self-attention mechanism. As can be observed in Equation (2), {v1} typically enables knowledge conveyance between tokens at different positions. In order to incorporate relative position information, we require the inner product of query {v2} and key {v3} to be formulated by a function {v4}, which takes only the word embeddings {v5}, and their relative position {v6} as input variables. In other words, we hope that the inner product encodes position information only in the relative form:", "labels": [["A", "9b", "Mô hình ngôn ngữ dựa trên Transformer thường tận dụng thông tin vị trí của từng token thông qua cơ chế tự chú ý. Như có thể quan sát trong phương trình (2), {v1} thường cho phép truyền tải kiến thức giữa các token ở các vị trí khác nhau. Để kết hợp thông tin vị trí tương đối, chúng tôi yêu cầu tích vô hướng của truy vấn {v2} và khóa {v3} phải được xây dựng bởi một hàm {v4}, lấy làm biến đầu vào chỉ là các nhúng từ {v5} và vị trí tương đối {v6} của chúng. Nói cách khác, chúng tôi hy vọng tích vô hướng mã hóa thông tin vị trí chỉ dưới dạng tương đối:"], ["B", "4b", "Mô hình hóa ngôn ngữ dựa trên Transformer thường tận dụng thông tin vị trí của từng token thông qua cơ chế tự chú ý. Như có thể thấy trong Phương trình (2), {v1} thường cho phép truyền đạt kiến thức giữa các token ở các vị trí khác nhau. Để tích hợp thông tin vị trí tương đối, chúng tôi yêu cầu tích vô hướng của truy vấn {v2} và key {v3} được xây dựng bởi một hàm {v4}, chỉ lấy nhúng từ {v5} và vị trí tương đối {v6} của chúng làm biến đầu vào. Nói cách khác, chúng tôi hy vọng tích vô hướng mã hóa thông tin vị trí chỉ dưới dạng tương đối:"], ["C", "google", "Mô hình hóa ngôn ngữ dựa trên máy biến áp thường tận dụng thông tin vị trí của từng mã thông báo thông qua cơ chế tự chú ý. Như có thể thấy trong Phương trình (2), {v1} thường cho phép truyền tải kiến ​​thức giữa các mã thông báo ở các vị trí khác nhau. Để kết hợp thông tin vị trí tương đối, chúng tôi yêu cầu tích bên trong của truy vấn {v2} và khóa {v3} phải được tạo bởi hàm {v4}, hàm này chỉ lấy các từ nhúng {v5} và vị trí tương đối của chúng {v6} làm biến đầu vào. Nói cách khác, chúng tôi hy vọng rằng sản phẩm bên trong chỉ mã hóa thông tin vị trí ở dạng tương đối:"], ["D", "2b", "Mô hình ngôn ngữ dựa trên Transformer thường sử dụng thông tin vị trí của từng token thông qua cơ chế tự chú ý. Như có thể thấy trong Phương trình (2), {v1} thường cho phép truyền thông tin giữa các token ở các vị trí khác nhau. Để tích hợp thông tin vị trí tương đối, chúng tôi cần hình thành tích const KEY = "vietpaper-quality-human";

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch {}; progress(); };
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let shown = false;

function progress() {
  const done = DATA.filter(it => (ans[it.id] || {}).best).length;
  document.getElementById("prog").textContent = `đã chấm ${done}/${DATA.length}`;
}

function draw() {
  document.getElementById("list").innerHTML = DATA.map(it => {
    const a = ans[it.id] || {};
    const cands = it.labels.map(([lab, sys, vi]) => `
      <div class="cand">
        <div class="lab">${lab}<div class="who" data-who="${esc(sys)}"></div></div>
        <div>
          <div class="vi">${esc(vi)}</div>
          <div class="row">
            ${AXES.map(([k, name]) => `<label>${name}
              <select data-it="${it.id}" data-lab="${lab}" data-ax="${k}">
                ${[0,1,2,3,4,5].map(v => `<option value="${v}"${(a[lab]||{})[k]===v?" selected":""}>${v||"–"}</option>`).join("")}
              </select></label>`).join("")}
            <label><input type="radio" name="best-${it.id}" value="${lab}"${a.best===lab?" checked":""}> tốt nhất</label>
            <label><input type="radio" name="worst-${it.id}" value="${lab}"${a.worst===lab?" checked":""}> kém nhất</label>
          </div>
        </div>
      </div>`).join("");
    return `<div class="item"><div class="hint">${esc(it.paper)} · trang ${it.page} · đoạn ${it.block}</div>
      <div class="src">${esc(it.src)}</div>${cands}</div>`;
  }).join("");
  document.querySelectorAll("select").forEach(s => s.onchange = e => {
    const {it, lab, ax} = e.target.dataset;
    ((ans[it] ||= {})[lab] ||= {})[ax] = +e.target.value;
    save();
  });
  document.querySelectorAll('input[type=radio]').forEach(r => r.onchange = e => {
    const [kind, id] = e.target.name.split("-");
    (ans[id] ||= {})[kind] = e.target.value;
    save();
  });
  progress();
}

document.getElementById("reveal").onclick = () => {
  shown = !shown;
  document.querySelectorAll("[data-who]").forEach(el => el.textContent = shown ? el.dataset.who : "");
  document.getElementById("reveal").textContent = shown ? "Ẩn tên hệ thống" : "Hiện tên hệ thống";
  document.getElementById("sum").innerHTML = shown ? summary() : "";
};
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify({answers: ans, data: DATA}, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "human.json"; a.click();
};
document.getElementById("reset").onclick = () => {
  if (confirm("Xoá toàn bộ bài đã chấm?")) { ans = {}; save(); draw(); }
};

function summary() {
  const sys = {};
  const add = (s, k, v) => { (sys[s] ||= {n:0, best:0, worst:0, ...Object.fromEntries(AXES.map(([a])=>[a,0]))})[k] += v; };

      if (AXES.some(([k]) => sc[k])) { add(s, "n", 1); AXES.forEach(([k]) => add(s, k, sc[k] || 0)); }
      if (a.best === lab) add(s, "best", 1);
      if (a.worst === lab) add(s, "worst", 1);
    }
  }
  const jm = {};   // điểm trung bình của trọng tài LLM, để so với điểm người
  for (const r of (JUDGE.rows || [])) for (const [s, sc] of Object.entries(r.scores || {})) {
    (jm[s] ||= {n:0, t:0}); jm[s].n++; jm[s].t += AXES.reduce((x,[k]) => x + (sc[k]||0), 0) / AXES.length;
  }
  const rows = Object.entries(sys).map(([s, v]) => {
    const avg = AXES.map(([k]) => v.n ? v[k]/v.n : 0);
    return `<tr><td>${esc(s)}</td>${avg.map(x=>`<td>${x.toFixed(2)}</td>`).join("")}
      <td><b>${(avg.reduce((a,b)=>a+b,0)/AXES.length).toFixed(2)}</b></td>
      <td>${v.best}</td><td>${v.worst}</td>
      <td>${jm[s] ? (jm[s].t/jm[s].n).toFixed(2) : "–"}</td></tr>`;
  }).join("");
  return `<h2>Tổng kết</h2><table><tr><th>hệ thống</th>${AXES.map(([,n])=>`<th>${n}</th>`).join("")}
    <th>trung bình</th><th>nhất</th><th>bét</th><th>trọng tài ${esc(JUDGE.judge || "–")}</th></tr>${rows}</table>
    <p class="hint">Cột cuối là điểm của trọng tài LLM trên cùng bộ đoạn. Thứ hạng hai bên lệch nhau thì
    tin cột "trung bình" (người chấm) và bỏ điểm trọng tài.</p>`;
}
draw();
</script></html>
